project:
  type: website
  output-dir: docs
  post-render: "scripts/decktape.sh"   
  render:
    - "*.qmd"
    - "!assignments/"
    - "!files/tutorials/"
  resources:
    - files/tutorials/ec313-r-template.qmd
    - files/tutorials/ec313cis.csv

website:
  title: "EC313 - Taxation"
  navbar:
    pinned: true
    background: "#9e32a8"
    left:
      - href: index.qmd
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - text: "Content"
        file: content/index.qmd

  sidebar:
    - title: "Content"
      style: "docked"
      search: false
      background: dark
      contents:
      
        - section: "Overview"
          contents:
            - content/index.qmd
        - section: "Course content"
          contents:
            - text: "Intro to Public Finance"
              file: content/introtopf.qmd
            - text: "Tax Incidence"
              file: content/incidence.qmd
            - text: "Taxation and Efficiency"
              file: content/efficiency.qmd
            - text: "Introduction to R and Quarto"
              file: content/introtor.qmd
            - text: "Efficient and Equitable Taxation"
              file: content/equitable.qmd
            - text: "The Personal Income Tax"
              file: content/personaltax.qmd
            - text: "Personal Taxation and Behaviour"
              file: content/taxbehaviour.qmd
            - text: "Consumption Taxes"
              file: content/constax.qmd
            - text: "Externalities and Pigouvian Taxes"
              file: content/externalities.qmd
            - text: "The Corporation Tax"
              file: content/corptax.qmd
              
format:
  html:
    code-overflow: wrap
    theme: 
      - litera
      - html/custom.scss
    toc: true


